# Build, test and scan every pull request, and deploy the site to GitHub Pages
# from main, via the hashira static-webapp flow (templates/static-webapp/ci.yml
# in skathio/hashira). Pull requests run CI only; a push to main that touches
# the site, or a manual run on main, also deploys.
#
# Pages must be enabled with "GitHub Actions" as the source. Deploys are
# limited to main by the github-pages environment's branch policy.
name: ci
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    # hashira v3.0.0 (the peeled tag commit); every hashira pin here must match.
    uses: skathio/hashira/.github/workflows/static-webapp-ci.yml@2c8d52526cbce593a445f7572b599813503160f5
    permissions:
      contents: read # check out the repository
      id-token: write # upload-pages-artifact authenticates to Pages
      pages: write # upload-pages-artifact stores the site for deploy
      pull-requests: write # coverage comment on the pull request
      security-events: write # upload CodeQL results when CodeQL is enabled
    with:
      node_version: "22"
      output_dir: "dist"
  deploy:
    needs: ci
    # Pull requests never deploy, and neither does a manual run on another
    # branch: it builds and checks that branch only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    # One Pages deploy at a time; a queued deploy waits instead of cancelling one in flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write # deploy-pages publishes the site
      id-token: write # deploy-pages authenticates to Pages with OIDC
    steps:
      - uses: skathio/hashira/.github/actions/pages-deploy@2c8d52526cbce593a445f7572b599813503160f5
