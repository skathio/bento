# Weekly update PRs for Bento's GitHub Actions pins and npm packages.
#
# The two hashira pins in ci.yml must name the same SHA (tests/ci.test.ts);
# Dependabot bumps both in one PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
